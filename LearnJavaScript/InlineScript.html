<html>
    <head>
        <title>Tiêu đề trang</title>
    </head>
    <body>
        <h1>Nội dung trang</h1>
        <form>
            <h1>Select Color:</h1>
            <input type="radio" id="red" name="color" value="Red" onclick="changeColor('red')">
            <label for="red">Red</label><br>
            <input type="radio" id="green" name="color" value="Green" onclick="changeColor('green')" checked>
            <label for="green">Green</label><br>
            <div id="div_result" style="background-color: green;
            width:200px; height:100px; margin-top:10px;"></div>
        </form>
    </body>
</html>
