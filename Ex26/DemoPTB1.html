<html>
    <head>
        <title>Tiêu đề trang</title>
        <script type="text/javascript">
            function xulyGiai(a, b, kq)
            {
                //ã+b=0
                //=> x=-b/a
                ketqua.value= -eval(b)/eval(a)
            }
        </script>
    </head>
    <body>
        <form>
            <table>
                <tr>
                    <td colspan="2">Phương trình bậc 1</td>
                </tr>
                <tr>
                    <td>Hệ số a:</td>
                    <td><input type="text" id="hsa"></td>
                </tr>
                <tr>
                    <td>Hệ số b:</td>
                    <td><input type="text" id="hsb"></td>
                </tr>
                <tr>
                    <td>Kết quả:</td>
                    <td>
                        <input type="text" id="ketqua" >
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="button" value="Giải" onclick="xulyGiai(hsa.value,hsb.value,ketqua)">
                        &nbsp;
                        <input type="button" value="Thoát">
                    </td>
            </table>
        </form>
    </body>
</html>
